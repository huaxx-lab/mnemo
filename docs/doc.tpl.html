<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#EDEFF5; --surface:#FFFFFF; --surface-2:#F5F7FC; --line:#DEE2EC; --line-2:#E9ECF3;
  --ink:#12141C; --ink-2:#4A5060; --ink-3:#767D8F;
  --accent:#2B44A6; --accent-soft:#E6EAF8;
  --p0:#C6382B; --p0-bg:#FBE9E7; --p1:#2B44A6; --p1-bg:#E6EAF8; --p2:#6B7285; --p2-bg:#EAECF2;
  --goal-bg:#EDF1FC; --nongoal-bg:#F3F1EC; --nongoal-ink:#6B6355;
  --shadow:0 1px 2px rgba(18,20,28,.04), 0 10px 28px -14px rgba(18,20,28,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C0E14; --surface:#151822; --surface-2:#1C202B; --line:#282D3B; --line-2:#212532;
    --ink:#EBEDF2; --ink-2:#A3A9B9; --ink-3:#727989;
    --accent:#8AA0F5; --accent-soft:#1C2340;
    --p0:#F0786A; --p0-bg:#341C1A; --p1:#8AA0F5; --p1-bg:#1C2340; --p2:#8A91A3; --p2-bg:#242833;
    --goal-bg:#181E33; --nongoal-bg:#221F1A; --nongoal-ink:#B5AB99;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0C0E14; --surface:#151822; --surface-2:#1C202B; --line:#282D3B; --line-2:#212532;
  --ink:#EBEDF2; --ink-2:#A3A9B9; --ink-3:#727989;
  --accent:#8AA0F5; --accent-soft:#1C2340;
  --p0:#F0786A; --p0-bg:#341C1A; --p1:#8AA0F5; --p1-bg:#1C2340; --p2:#8A91A3; --p2-bg:#242833;
  --goal-bg:#181E33; --nongoal-bg:#221F1A; --nongoal-ink:#B5AB99;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:15.5px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
code{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
     font-size:.88em; background:var(--surface-2); border:1px solid var(--line-2);
     padding:.08em .38em; border-radius:5px}

.page{max-width:1180px; margin:0 auto; padding:0 24px 120px;
      display:grid; grid-template-columns:230px minmax(0,1fr); gap:52px; align-items:start}

/* ---- 侧栏目录 ---- */
nav{position:sticky; top:0; max-height:100vh; overflow-y:auto; padding:44px 0 40px;
    display:flex; flex-direction:column; gap:1px}
nav .navhead{font-size:11px; letter-spacing:.16em; text-transform:uppercase;
             color:var(--ink-3); font-weight:600; margin-bottom:12px}
nav a{text-decoration:none; color:var(--ink-2); font-size:13.5px; padding:5px 12px;
      border-radius:7px; border-left:2px solid transparent; line-height:1.45}
nav a.l2{font-weight:600; color:var(--ink); margin-top:14px}
nav a.l3{padding-left:20px; font-size:13px}
nav a:hover{background:var(--surface); color:var(--accent)}
nav a:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ---- 正文 ---- */
main{padding:44px 0 0; min-width:0}
h1{font-size:36px; line-height:1.18; font-weight:700; letter-spacing:-.025em;
   margin:0 0 10px; text-wrap:balance}
h2{font-size:23px; font-weight:600; letter-spacing:-.015em; margin:64px 0 20px;
   padding-bottom:12px; border-bottom:1px solid var(--line); scroll-margin-top:24px}
h3{font-size:18.5px; font-weight:600; letter-spacing:-.01em; margin:48px 0 14px;
   color:var(--accent); scroll-margin-top:24px}
h4{font-size:15.5px; font-weight:600; margin:30px 0 8px; scroll-margin-top:24px;
   display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
p{margin:0 0 14px; max-width:74ch; color:var(--ink-2)}
main > p:first-of-type{color:var(--ink-2)}
h1 + p{font-size:17px; color:var(--ink-2)}
strong{color:var(--ink); font-weight:600}
ul,ol{margin:0 0 16px; padding-left:22px; max-width:74ch; color:var(--ink-2)}
li{margin:5px 0}
li::marker{color:var(--ink-3)}
pre.mermaid{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:26px 20px; margin:0 0 22px; overflow-x:auto; box-shadow:var(--shadow); text-align:center}
pre.code{background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin:0 0 20px; overflow-x:auto; font-family:"IBM Plex Mono",monospace;
  font-size:13px; line-height:1.6; color:var(--ink-2)}
hr{border:none; border-top:1px solid var(--line); margin:52px 0}

/* ---- 优先级标签 ---- */
.pri{font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
     letter-spacing:.06em; padding:2px 7px; border-radius:5px; white-space:nowrap;
     position:relative; top:-1px}
.pri.p0{background:var(--p0-bg); color:var(--p0)}
.pri.p1{background:var(--p1-bg); color:var(--p1)}
.pri.p2{background:var(--p2-bg); color:var(--p2)}

/* ---- 目标 / 非目标 ---- */
.callout{max-width:74ch; padding:11px 16px; border-radius:9px; margin:0 0 12px;
         font-size:14.5px; line-height:1.65}
.callout .ck{font-weight:600; font-size:11.5px; letter-spacing:.1em; margin-right:10px;
             padding:2px 7px; border-radius:5px; white-space:nowrap}
.callout.goal{background:var(--goal-bg); color:var(--ink-2)}
.callout.goal .ck{background:var(--accent); color:#fff}
.callout.nongoal{background:var(--nongoal-bg); color:var(--nongoal-ink)}
.callout.nongoal .ck{background:var(--nongoal-ink); color:var(--nongoal-bg)}

/* ---- 表格 ---- */
.tw{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    overflow-x:auto; margin:0 0 22px; box-shadow:var(--shadow)}
table{width:100%; border-collapse:collapse; font-size:13.8px; min-width:600px}
th,td{text-align:left; padding:11px 16px; border-bottom:1px solid var(--line-2);
      vertical-align:top; line-height:1.6}
th{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
   font-weight:600; white-space:nowrap; background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td{color:var(--ink-2)}
.tw.ids td:first-child{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  white-space:nowrap; color:var(--ink); font-size:12.8px}
.tw.ids td:nth-child(2){white-space:nowrap; color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace; font-size:12.5px}
.tw.ids td:nth-child(3){min-width:22ch}
.tw:not(.ids) td:first-child{color:var(--ink); font-weight:500}
.tw:not(.ids) table{min-width:520px}

@media (max-width:900px){
  .page{grid-template-columns:1fr; gap:0}
  nav{position:static; max-height:none; padding:32px 0 0;
      border-bottom:1px solid var(--line); margin-bottom:8px}
  nav a.l3{display:none}
  nav{flex-direction:row; flex-wrap:wrap; gap:6px}
  nav .navhead{width:100%; margin-bottom:6px}
  nav a.l2{margin-top:0; background:var(--surface); border-radius:7px}
  h1{font-size:28px}
}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }
</style>

<div class="page">
  <nav><div class="navhead">目录</div>__NAV__</nav>
  <main>__BODY__</main>
</div>
